# Local-cluster demo credentials, matching compose.yaml's postgres service.
# A real deployment would generate this out-of-band (sealed-secrets, an
# external secret store, etc.) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay
  POSTGRES_DB: agent_relay
