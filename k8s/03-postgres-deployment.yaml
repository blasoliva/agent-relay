apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agent-relay
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    # A single ReadWriteOnce PVC can only be mounted by one pod at a time;
    # RollingUpdate would try to bring up a second pod before the first
    # releases the volume and get stuck. Recreate tears down first.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Postgres refuses to initialize directly on top of a volume's
            # lost+found directory; nest the data directory one level down.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_relay", "-d", "agent_relay"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_relay", "-d", "agent_relay"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
